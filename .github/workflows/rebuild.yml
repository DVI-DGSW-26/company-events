name: 행사 자료 다시 만들기

# 화면에서 행사를 등록·수정하면 data/ 와 photos/ 가 바뀐다.
# 그 push 를 받아 기사 PDF·썸네일·ZIP·목록을 다시 만들어 되커밋한다.
# (되커밋은 GITHUB_TOKEN 으로 하므로 이 워크플로가 다시 돌지 않는다)

on:
  push:
    branches: [main]
    paths:
      - 'data/events.json'
      - 'photos/**'
      - 'videos/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 연달아 저장하면 마지막 것만 빌드한다
  group: rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: 빌드 도구 설치
        working-directory: tools
        run: npm ci

      - name: 브라우저 준비 (기사 PDF 저장용)
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: 기사 원문 PDF 저장
        working-directory: tools
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        # 기사 사이트가 막아도 빌드 전체를 멈추지는 않는다. 그 기사는 링크로만 남는다.
        continue-on-error: true
        run: node make-articles.mjs

      - name: 사진·ZIP·목록 다시 만들기
        working-directory: tools
        run: node build.mjs

      - name: 바뀐 결과물 커밋
        run: |
          git config user.name  "행사 아카이브"
          git config user.email "noreply@dvi-ind.com"
          git add -A assets/data.js data downloads photos thumbs articles videos
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
            exit 0
          fi
          git commit -m "행사 자료 다시 만듦 [skip ci]"
          git push
