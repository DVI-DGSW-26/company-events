<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · 행사 아카이브</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%231B2428'/%3E%3Crect x='7' y='9' width='18' height='3' fill='%23E0530D'/%3E%3Crect x='7' y='15' width='18' height='2' fill='%238A949A'/%3E%3Crect x='7' y='20' width='12' height='2' fill='%238A949A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --color-canvas:#f2f3f7; --color-surface:#ffffff; --color-surface-2:#f4f5f7;
    --color-line:#eceef1; --color-edge:#e6e8ec;
    --color-fg:#1c1f26; --color-fg-muted:#5f6673; --color-fg-subtle:#8e95a1; --color-fg-faint:#c4c8cf;
    --color-brand:#E0530D; --color-brand-hover:#B23F05; --color-on-brand:#ffffff;
  }
  @media (min-width:1024px){ html{font-size:106.25%} }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0; min-height:100vh;
    display:grid; place-items:center;
    padding:1.5rem;
    background:var(--color-canvas);
    color:var(--color-fg);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    font-size:.875rem; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:26rem;
    background:var(--color-surface);
    border:1px solid var(--color-edge); border-radius:.75rem;
    padding:2.5rem 2rem 2rem;
  }
  .mark{
    width:6px; height:2.5rem; border-radius:2px; margin-bottom:1.5rem;
    background:linear-gradient(var(--color-brand) 0 55%,var(--color-fg-faint) 55% 100%);
  }
  h1{margin:0; font-size:1.875rem; font-weight:700; line-height:1.2}
  .lede{margin:.75rem 0 2rem; color:var(--color-fg-muted)}
  .lede b{color:var(--color-fg); font-weight:600}

  /* Primary Large 48px */
  .btn{
    display:flex; align-items:center; justify-content:center; gap:.375rem;
    width:100%; height:3rem;
    background:var(--color-brand); color:var(--color-on-brand);
    border-radius:.375rem; text-decoration:none;
    font-size:1rem; font-weight:600;
  }
  .btn:hover{background:var(--color-brand-hover)}
  .btn svg{width:18px;height:18px;flex:none}
  .btn:focus-visible{outline:2px solid var(--color-brand); outline-offset:2px}

  .note{
    margin:1.5rem 0 0; padding-top:1.25rem;
    border-top:1px solid var(--color-line);
    font-size:.75rem; color:var(--color-fg-muted);
  }
  .note b{color:var(--color-fg)}
  .msg{
    margin:0 0 1.25rem; padding:.75rem 1rem;
    background:var(--color-surface-2);
    border-radius:.5rem; font-size:.875rem; color:var(--color-fg-muted);
  }
  .msg--quiet{background:var(--color-surface-2); color:var(--color-fg-muted)}
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true"></div>
    <h1>행사 아카이브</h1>
    <p class="lede">회사 행사 사진과 언론기사를 모아 둔 곳입니다.<br><b>사내 계정</b>으로 로그인하면 들어갈 수 있습니다.</p>

    <p class="msg msg--quiet" id="msg" hidden></p>

    <a class="btn" id="go" href="/api/auth/login">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span>사내 계정으로 로그인</span>
    </a>

    <p class="note">
      다른 사내 서비스와 <b>같은 계정</b>을 씁니다. 이미 로그인돼 있으면 바로 들어옵니다.<br>
      계정이 없거나 로그인이 안 되면 경영지원팀에 문의하세요.
    </p>
  </main>

<script>
  // 로그인 후 원래 보려던 주소로 돌아가도록 next 를 넘긴다
  const params = new URLSearchParams(location.search);
  const next = params.get('next');
  if (next && next.startsWith('/') && !next.startsWith('//')) {
    document.getElementById('go').href = '/api/auth/login?next=' + encodeURIComponent(next);
  }

  const msg = document.getElementById('msg');
  if (params.has('bye')) {
    msg.textContent = '로그아웃했습니다.';
    msg.hidden = false;
  } else if (next && next !== '/') {
    msg.textContent = '이어서 보려면 로그인이 필요합니다.';
    msg.hidden = false;
  }
</script>
</body>
</html>
