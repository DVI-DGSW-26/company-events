<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · 행사 아카이브</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%231B2428'/%3E%3Crect x='7' y='9' width='18' height='3' fill='%23E0530D'/%3E%3Crect x='7' y='15' width='18' height='2' fill='%238A949A'/%3E%3Crect x='7' y='20' width='12' height='2' fill='%238A949A'/%3E%3C/svg%3E">
<style>
  :root{
    --alu-50:#F6F7F8; --alu-100:#EDEFF1; --alu-200:#D8DDE0; --alu-300:#C3CACE;
    --alu-500:#7B878D; --alu-700:#48545A; --alu-900:#1B2428;
    --mark:#E0530D; --mark-deep:#B23F05; --mark-wash:#FCEFE7;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0; min-height:100vh;
    display:grid; place-items:center;
    padding:1.5rem;
    background:var(--alu-100);
    color:var(--alu-900);
    font-family:"IBM Plex Sans KR","Malgun Gothic","맑은 고딕",-apple-system,"Segoe UI",sans-serif;
    font-size:.875rem; line-height:1.6;
  }
  .card{
    width:100%; max-width:26rem;
    background:#fff;
    border:1px solid var(--alu-200); border-radius:6px;
    padding:2.25rem 2rem 1.75rem;
    box-shadow:0 1px 2px rgba(27,36,40,.06),0 10px 30px -18px rgba(27,36,40,.35);
  }
  .mark{
    width:4px; height:22px; border-radius:1px; margin-bottom:1.25rem;
    background:linear-gradient(var(--mark) 0 55%,var(--alu-300) 55% 100%);
  }
  h1{margin:0; font-size:1.3rem; font-weight:600; letter-spacing:-.02em}
  .lede{margin:.5rem 0 1.75rem; color:var(--alu-700)}
  .lede b{color:var(--alu-900); font-weight:600}

  .btn{
    display:flex; align-items:center; justify-content:center; gap:.625rem;
    width:100%; height:44px;
    background:var(--alu-900); color:#fff;
    border-radius:5px; text-decoration:none;
    font-size:.9375rem; font-weight:500;
  }
  .btn:hover{background:#0F1619}
  .btn svg{width:18px;height:18px;flex:none}
  .btn:focus-visible{outline:2px solid var(--mark); outline-offset:2px}

  .note{
    margin:1.5rem 0 0; padding-top:1.25rem;
    border-top:1px solid var(--alu-100);
    font-size:.75rem; color:var(--alu-500);
  }
  .msg{
    margin:0 0 1.25rem; padding:.625rem .75rem;
    background:var(--mark-wash); border-left:2px solid var(--mark);
    border-radius:3px; font-size:.8125rem; color:var(--mark-deep);
  }
  .msg--quiet{background:var(--alu-50); border-left-color:var(--alu-300); color:var(--alu-700)}
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true"></div>
    <h1>행사 아카이브</h1>
    <p class="lede">회사 행사 사진과 언론기사를 모아 둔 곳입니다.<br><b>사내 계정</b>으로 로그인하면 들어갈 수 있습니다.</p>

    <p class="msg msg--quiet" id="msg" hidden></p>

    <a class="btn" id="go" href="/api/auth/login">
      <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <rect x="3.2" y="7.8" width="11.6" height="8" rx="1.6"/>
        <path d="M6 7.8V5.4a3 3 0 0 1 6 0v2.4" stroke-linecap="round"/>
        <circle cx="9" cy="11.6" r="1.1" fill="currentColor" stroke="none"/>
      </svg>
      <span>사내 계정으로 로그인</span>
    </a>

    <p class="note">
      다른 사내 서비스와 <b>같은 계정</b>을 씁니다. 이미 로그인돼 있으면 바로 들어옵니다.<br>
      계정이 없거나 로그인이 안 되면 경영지원팀에 문의하세요.
    </p>
  </main>

<script>
  // 로그인 후 원래 보려던 주소로 돌아가도록 next 를 넘긴다
  const params = new URLSearchParams(location.search);
  const next = params.get('next');
  if (next && next.startsWith('/') && !next.startsWith('//')) {
    document.getElementById('go').href = '/api/auth/login?next=' + encodeURIComponent(next);
  }

  const msg = document.getElementById('msg');
  if (params.has('bye')) {
    msg.textContent = '로그아웃했습니다.';
    msg.hidden = false;
  } else if (next && next !== '/') {
    msg.textContent = '이어서 보려면 로그인이 필요합니다.';
    msg.hidden = false;
  }
</script>
</body>
</html>
